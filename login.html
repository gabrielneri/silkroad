<!DOCTYPE html>
<html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Silk Road | Login</title>
</head>
<body>
    <div class="login-bg">
        <form class="login-content" action="" method="post" name="login-form" id="login-id">
            <div class="imgcontainer">
                <img src='./img/avatar.png' alt="avatar" class="avatar"/>
            </div>
            <div class="login-m">
                <label for="uname"><b>Email</b></label>
                <input type="text" placeholder="Digite seu email" name="uname" required>
                <label for="psw"><b>Senha</b></label>
                <input type="password" placeholder="Digite sua senha" name="psw" required>
                <button class="entrar" type="submit">Entrar</button>
                <a class="cadastrar" href="cadastro.html">Cadastrar<a>
            </div>
        </form>
    </div>
</body>
</html>
